<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fast Break Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600&display=swap">
<style>
/* Layout: one full-screen canvas with a slim HUD strip and centered modal cards. Single dark arena look by choice. */
:root {
  --court: #0d0f1a;
  --panel: rgba(13, 15, 26, 0.86);
  --ink: #f2efe6;
  --dim: #9aa0b8;
  --ball: #ff7a1a;
  --line: #3ad1ff;
  --font-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --font-body: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--court);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  touch-action: none;
  user-select: none;
}
#stage { position: fixed; inset: 0; }
canvas { display: block; }
.hud {
  position: fixed; left: 0; right: 0; top: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.stat { display: grid; gap: 2px; }
.stat .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.stat .value { font-family: var(--font-display); font-size: clamp(22px, 5vw, 34px); font-variant-numeric: tabular-nums; line-height: 1; }
.stat.right { text-align: right; }
#mult { color: var(--ball); }
.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at center, rgba(13,15,26,0.55), rgba(13,15,26,0.9));
}
.card {
  width: min(460px, 100%);
  background: var(--panel);
  border: 1px solid rgba(58, 209, 255, 0.35);
  border-radius: 14px;
  padding: 28px 24px;
  display: grid; gap: 16px; text-align: center;
}
.card h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(34px, 9vw, 56px); line-height: 0.95; text-wrap: balance;
  color: var(--ball);
  text-shadow: 0 0 22px rgba(255, 122, 26, 0.45);
}
.card p { margin: 0; color: var(--dim); line-height: 1.5; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; text-align: left; font-size: 14px; }
.keys kbd {
  font-family: var(--font-body); font-weight: 600; font-size: 12px;
  border: 1px solid var(--dim); border-radius: 5px; padding: 2px 7px; color: var(--ink);
  white-space: nowrap; justify-self: start;
}
.result { font-family: var(--font-display); font-size: 44px; font-variant-numeric: tabular-nums; color: var(--ink); }
button {
  font-family: var(--font-display); font-size: 18px; letter-spacing: 0.04em;
  background: var(--ball); color: var(--court); border: 0; border-radius: 10px;
  padding: 14px 20px; cursor: pointer;
}
button:hover { filter: brightness(1.1); }
button:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; }
#flash {
  position: fixed; left: 50%; top: 22%; transform: translateX(-50%);
  font-family: var(--font-display); font-size: clamp(20px, 5vw, 30px);
  color: var(--line); pointer-events: none; opacity: 0; transition: opacity 0.25s;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="stage"></div>

<div class="hud">
  <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
  <div class="stat right"><span class="label">Multiplier</span><span class="value" id="mult">x1</span></div>
</div>
<div id="flash"></div>

<div class="overlay" id="start">
  <div class="card">
    <h1>Fast Break</h1>
    <p>Push the ball down the court. Slip past defenders, hop the screens, and grab every orb to build your multiplier.</p>
    <div class="keys">
      <kbd>A / D</kbd><span>Switch lanes (or swipe)</span>
      <kbd>W / Space</kbd><span>Jump over low screens (or swipe up)</span>
      <kbd>Orbs</kbd><span>Each 10 in a row raises the multiplier</span>
    </div>
    <button id="playBtn">Start the break</button>
    <p id="bestStart">Best: 0</p>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <h1>Turnover</h1>
    <div class="result" id="finalScore">0</div>
    <p id="finalDetail"></p>
    <button id="againBtn">Run it back</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- Config ----------
  const LANES = [-2.6, 0, 2.6];
  const BALL_R = 0.6;
  const GRAVITY = 32;
  const JUMP_V = 11.5;
  const SPAWN_Z = -140;
  const START_SPEED = 16;
  const MAX_SPEED = 42;

  // ---------- Renderer, scene, camera ----------
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0f1a);
  scene.fog = new THREE.Fog(0x0d0f1a, 35, 130);

  const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(0, 4.2, 8);
  camera.lookAt(0, 1, -8);

  scene.add(new THREE.HemisphereLight(0x8fb8ff, 0x20140c, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(4, 12, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
  sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
  scene.add(sun);

  // ---------- Court ----------
  // Hardwood texture drawn on a canvas so the page needs no image files.
  function woodTexture() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 512;
    const g = c.getContext('2d');
    for (let i = 0; i < 8; i++) {
      const shade = 150 + Math.floor(Math.random() * 30);
      g.fillStyle = `rgb(${shade}, ${Math.floor(shade * 0.66)}, ${Math.floor(shade * 0.38)})`;
      g.fillRect(i * 32, 0, 32, 512);
      g.fillStyle = 'rgba(0,0,0,0.18)';
      g.fillRect(i * 32, 0, 1, 512);
      for (let j = 0; j < 6; j++) {
        g.fillRect(i * 32, Math.random() * 512, 32, 1);
      }
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(1, 10);
    return t;
  }
  const floorTex = woodTexture();
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(9, 300),
    new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.z = -120;
  floor.receiveShadow = true;
  scene.add(floor);

  // Glowing sidelines and lane dividers.
  const lineMat = new THREE.MeshBasicMaterial({ color: 0x3ad1ff });
  [-4.5, 4.5].forEach(x => {
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 300), lineMat);
    l.position.set(x, 0.03, -120);
    scene.add(l);
  });
  // Dashed lane dividers scroll with the world to sell the speed.
  const dashes = [];
  const dashMat = new THREE.MeshBasicMaterial({ color: 0xf2efe6, transparent: true, opacity: 0.35 });
  for (const x of [-1.3, 1.3]) {
    for (let i = 0; i < 30; i++) {
      const d = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 2), dashMat);
      d.position.set(x, 0.02, -i * 5);
      scene.add(d);
      dashes.push(d);
    }
  }

  // Crowd stands: rows of dim blocks on both sides for a sense of an arena.
  const standMat = new THREE.MeshStandardMaterial({ color: 0x1b2036, roughness: 1 });
  for (const side of [-1, 1]) {
    for (let r = 0; r < 4; r++) {
      const s = new THREE.Mesh(new THREE.BoxGeometry(3, 1 + r * 1.2, 300), standMat);
      s.position.set(side * (6.5 + r * 2.4), (1 + r * 1.2) / 2, -120);
      scene.add(s);
    }
  }

  // ---------- Player ball ----------
  function ballTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#ff7a1a'; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = '#2a1405'; g.lineWidth = 6;
    g.beginPath(); g.moveTo(0, 128); g.lineTo(256, 128); g.stroke();
    g.beginPath(); g.moveTo(128, 0); g.lineTo(128, 256); g.stroke();
    g.beginPath(); g.arc(0, 128, 90, -Math.PI / 2, Math.PI / 2); g.stroke();
    g.beginPath(); g.arc(256, 128, 90, Math.PI / 2, Math.PI * 1.5); g.stroke();
    return new THREE.CanvasTexture(c);
  }
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R, 32, 24),
    new THREE.MeshStandardMaterial({ map: ballTexture(), roughness: 0.7 })
  );
  ball.castShadow = true;
  scene.add(ball);

  // ---------- Obstacles and orbs (pooled) ----------
  const defenderGeo = new THREE.BoxGeometry(1.5, 2.2, 0.9);
  const defenderMat = new THREE.MeshStandardMaterial({ color: 0xd8344a, roughness: 0.5 });
  const screenGeo = new THREE.BoxGeometry(2.1, 0.7, 0.5);
  const screenMat = new THREE.MeshStandardMaterial({ color: 0xf2efe6, emissive: 0x3ad1ff, emissiveIntensity: 0.35 });
  const orbGeo = new THREE.TorusGeometry(0.38, 0.12, 10, 24);
  const orbMat = new THREE.MeshStandardMaterial({ color: 0x3ad1ff, emissive: 0x3ad1ff, emissiveIntensity: 0.8 });

  let objects = []; // { mesh, kind: 'defender' | 'screen' | 'orb', lane }

  function spawnRow(z) {
    // Always leave at least one lane open so every row is passable.
    const open = Math.floor(Math.random() * 3);
    LANES.forEach((x, lane) => {
      if (lane === open) {
        if (Math.random() < 0.7) spawnOrbs(lane, z);
        return;
      }
      const r = Math.random();
      if (r < 0.45) addObject('defender', lane, z);
      else if (r < 0.75) addObject('screen', lane, z);
      else if (r < 0.9) spawnOrbs(lane, z);
    });
  }
  function spawnOrbs(lane, z) {
    for (let i = 0; i < 4; i++) addObject('orb', lane, z - i * 2.2);
  }
  function addObject(kind, lane, z) {
    let mesh;
    if (kind === 'defender') { mesh = new THREE.Mesh(defenderGeo, defenderMat); mesh.position.y = 1.1; }
    else if (kind === 'screen') { mesh = new THREE.Mesh(screenGeo, screenMat); mesh.position.y = 0.35; }
    else { mesh = new THREE.Mesh(orbGeo, orbMat); mesh.position.y = 1.0; }
    mesh.castShadow = kind !== 'orb';
    mesh.position.x = LANES[lane];
    mesh.position.z = z;
    scene.add(mesh);
    objects.push({ mesh, kind, lane, alive: true });
  }
  function clearObjects() {
    objects.forEach(o => scene.remove(o.mesh));
    objects = [];
  }

  // ---------- State ----------
  const ui = {
    score: document.getElementById('score'),
    mult: document.getElementById('mult'),
    flash: document.getElementById('flash'),
    start: document.getElementById('start'),
    over: document.getElementById('over'),
    final: document.getElementById('finalScore'),
    detail: document.getElementById('finalDetail'),
    bestStart: document.getElementById('bestStart'),
  };

  let best = 0;
  try { best = parseInt(localStorage.getItem('fastbreak-best') || '0', 10) || 0; } catch (e) {}
  ui.bestStart.textContent = `Best: ${best}`;

  let running = false;
  let speed, distance, score, orbs, orbChain, mult, lane, targetX, y, vy, nextRowZ, flashTimer;

  function reset() {
    clearObjects();
    speed = START_SPEED; distance = 0; score = 0; orbs = 0; orbChain = 0; mult = 1;
    lane = 1; targetX = LANES[1]; y = BALL_R; vy = 0;
    ball.position.set(0, BALL_R, 0);
    nextRowZ = -40;
    for (let z = -40; z > SPAWN_Z; z -= 18) spawnRow(z);
    nextRowZ = SPAWN_Z;
    updateHud();
  }

  function start() {
    reset();
    ui.start.hidden = true;
    ui.over.hidden = true;
    running = true;
  }

  function gameOver() {
    running = false;
    score = Math.floor(score);
    const newBest = score > best;
    if (newBest) {
      best = score;
      try { localStorage.setItem('fastbreak-best', String(best)); } catch (e) {}
    }
    ui.final.textContent = score;
    ui.detail.textContent = `${Math.floor(distance)} m run, ${orbs} orbs. ${newBest ? 'New best!' : `Best: ${best}`}`;
    ui.bestStart.textContent = `Best: ${best}`;
    ui.over.hidden = false;
    document.getElementById('againBtn').focus();
  }

  function flash(text) {
    ui.flash.textContent = text;
    ui.flash.style.opacity = 1;
    flashTimer = 0.9;
  }

  function updateHud() {
    ui.score.textContent = Math.floor(score);
    ui.mult.textContent = `x${mult}`;
  }

  // ---------- Input ----------
  function moveLane(d) {
    if (!running) return;
    lane = Math.max(0, Math.min(2, lane + d));
    targetX = LANES[lane];
  }
  function jump() {
    if (!running) return;
    if (y <= BALL_R + 0.01) vy = JUMP_V;
  }
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') moveLane(-1);
    else if (k === 'd' || k === 'arrowright') moveLane(1);
    else if (k === 'w' || k === 'arrowup' || k === ' ') { e.preventDefault(); if (running) jump(); else start(); }
  });
  let touchStart = null;
  window.addEventListener('touchstart', e => { touchStart = e.touches[0]; }, { passive: true });
  window.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.clientX;
    const dy = t.clientY - touchStart.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) jump();
    else if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
    else if (dy < 0) jump();
    touchStart = null;
  }, { passive: true });
  document.getElementById('playBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);

  // ---------- Loop ----------
  const clock = new THREE.Clock();
  function tick() {
    const dt = Math.min(clock.getDelta(), 1 / 30);

    if (running) {
      speed = Math.min(MAX_SPEED, speed + dt * 0.55);
      const dz = speed * dt;
      distance += dz;
      score += dz * mult;

      // Smooth lane change and jump arc.
      ball.position.x += (targetX - ball.position.x) * Math.min(1, dt * 14);
      vy -= GRAVITY * dt;
      y += vy * dt;
      if (y < BALL_R) { y = BALL_R; vy = 0; }
      ball.position.y = y;
      ball.rotation.x -= dz / BALL_R;

      // Scroll the world toward the camera.
      floorTex.offset.y += dz / 30;
      dashes.forEach(d => { d.position.z += dz; if (d.position.z > 6) d.position.z -= 150; });

      for (const o of objects) {
        o.mesh.position.z += dz;
        if (o.kind === 'orb') o.mesh.rotation.y += dt * 4;
        if (!o.alive) continue;
        const dzc = Math.abs(o.mesh.position.z - ball.position.z);
        const dxc = Math.abs(o.mesh.position.x - ball.position.x);
        if (o.kind === 'orb') {
          if (dzc < 0.9 && dxc < 0.9 && y < 2) {
            o.alive = false;
            scene.remove(o.mesh);
            orbs++; orbChain++;
            score += 25 * mult;
            if (orbChain % 10 === 0) { mult = Math.min(mult + 1, 8); flash(`Multiplier x${mult}`); }
          }
        } else {
          const hitDepth = o.kind === 'defender' ? 0.95 : 0.8;
          const clearHeight = o.kind === 'defender' ? 99 : 0.7 + BALL_R;
          if (dzc < hitDepth && dxc < 1.15 && y < clearHeight) { gameOver(); break; }
        }
        // Missed an orb: the chain resets but the multiplier stays.
        if (o.kind === 'orb' && o.alive && o.mesh.position.z > 1.5) { o.alive = false; orbChain = 0; }
      }
      objects = objects.filter(o => {
        if (o.mesh.position.z > 10) { scene.remove(o.mesh); return false; }
        return o.alive || o.kind === 'orb' ? o.mesh.parent !== null : true;
      });

      // Spawn new rows; gaps shrink as speed climbs.
      nextRowZ += dz;
      const gap = Math.max(11, 20 - (speed - START_SPEED) * 0.3);
      while (nextRowZ > SPAWN_Z + gap) { nextRowZ -= gap; spawnRow(nextRowZ); }

      // Camera follows the ball a little for a sense of weight.
      camera.position.x += (ball.position.x * 0.45 - camera.position.x) * Math.min(1, dt * 5);
      camera.lookAt(camera.position.x * 0.6, 1, -8);

      if (flashTimer > 0) { flashTimer -= dt; if (flashTimer <= 0) ui.flash.style.opacity = 0; }
      updateHud();
    } else {
      // Idle spin on the menu.
      ball.rotation.x -= dt * 2;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  reset();
  tick();
  document.getElementById('playBtn').focus();
})();
</script>
</body>
</html>
